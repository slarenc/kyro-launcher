<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KYRO Launcher</title><link rel="stylesheet" href="style.css"><script src="pickers.js" defer></script><script src="features.js" defer></script><script src="assist.js" defer></script><script src="app.js" defer></script></head>
<body><div id="app">
<aside class="sidebar"><div class="brand"><span>K</span><i>/</i><b>KYRO</b></div><nav id="navigation"></nav><div class="sidebar-bottom"><button id="mod-updates-card" class="mod-updates-card" aria-label="Обновления модов — открыть менеджер"><span>Обновления модов</span><strong>Проверяем…</strong><i aria-hidden="true">↗</i></button><button class="profile" id="profile-button"><span class="avatar">+</span><span><strong id="account-name">Добавить аккаунт</strong><small id="account-type">Офлайн / Microsoft</small></span><span class="chevron">⌄</span></button></div></aside>
<main><header class="titlebar" data-tauri-drag-region><span class="eyebrow" id="breadcrumb">MINECRAFT · JAVA EDITION</span><div class="window-controls"><button id="minimize" aria-label="Свернуть">−</button><button id="maximize" aria-label="Развернуть">□</button><button id="close" aria-label="Закрыть">×</button></div></header><div class="orbit" aria-hidden="true"><span></span></div><section id="page"></section><footer><span>KYRO <span class="muted">/</span> <span id="footer-version">1.21.1 · FABRIC</span></span><span><span id="memory-status">6 GB RAM</span><i class="dot"></i><span id="ready-status">ГОТОВ К ЗАПУСКУ</span></span></footer></main>
</div><div class="operation" id="operation" hidden><div><span id="operation-label"></span><button id="operation-dismiss" aria-label="Скрыть">×</button></div><progress id="operation-progress" max="1" value="0"></progress></div><div id="toast" role="status" hidden></div>
<dialog id="account-dialog"><button class="dialog-close" id="dialog-close" aria-label="Закрыть">×</button><div class="eyebrow">УЧЁТНЫЕ ЗАПИСИ</div><h2>Твой Minecraft.</h2><p class="muted">Добавь офлайн-аккаунт по нику или войди через Microsoft.</p><div id="account-content"></div></dialog>
</body></html>
