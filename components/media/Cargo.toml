[package]
name = "kyro-media"
version = "1.0.0"
edition = "2021"
[workspace]
[dependencies]
serde_json = "1"
base64 = "0.22"
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_System_Threading"] }
[profile.release]
opt-level = "s"
lto = true
strip = true
